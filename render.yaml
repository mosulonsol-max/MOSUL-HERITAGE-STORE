services:
  - type: web
    name: mosul-heritage-sale-api
    runtime: docker
    region: frankfurt
    plan: 0.5c-512mb
    dockerfilePath: ./sale-service/Dockerfile
    dockerContext: ./sale-service
    initialDeployHook: python install_delivery_artifact.py
    healthCheckPath: /health
    autoDeployTrigger: commit
    disk:
      name: sale-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: PORT
        value: "8080"
      - key: SALE_BIND
        value: 0.0.0.0
      # Keep activation under source control. A dashboard-only override can be
      # overwritten by a later Blueprint sync.
      - key: SALES_ENABLED
        value: "0"
      - key: SALE_DB
        value: /app/data/sales.sqlite3
      - key: DELIVERY_ENCRYPTED_PACKAGE_PATH
        value: /app/data/private/MOSUL-GENESIS-000001-package.zip.aes
      # Set the same protected 32-byte artwork signing seed used for the
      # encrypted artifact. It is held only as a private deployment secret.
      - key: ARTWORK_SIGNING_KEY_B64
        sync: false
      - key: SALE_ASSET_MANIFEST
        value: /app/products/MOSUL-GENESIS-000001.assets.json
      - key: DELIVERY_TOKEN_SECRET
        generateValue: true
      - key: SALE_ADMIN_TOKEN
        generateValue: true
      # Set the receiving wallet and signed seller terms only in Render's
      # private environment settings after verifying them. Never commit them.
      - key: SALES_MERCHANT_WALLET
        sync: false
      - key: SELLER_LEGAL_NAME
        sync: false
      - key: SELLER_TRADE_NAME
        sync: false
      - key: SELLER_COUNTRY
        sync: false
      - key: SELLER_ADDRESS
        sync: false
      - key: SELLER_SUPPORT_EMAIL
        value: mosulonsol@gmail.com
      - key: SELLER_TERMS_SIGNED_AT
        sync: false
      - key: SELLER_TERMS_SIGNATURE_B64
        sync: false
      - key: SALE_AUCTION_ID
        sync: false
      - key: SALE_AUCTION_STARTS_AT
        sync: false
      - key: SALE_AUCTION_ENDS_AT
        sync: false
      - key: SALE_ALLOWED_ORIGIN
        value: https://mosulonsol-max.github.io
