name: Auction readiness gates
on:
  push:
    branches: [main]
    paths:
      - 'sale-service/**'
      - 'checkout.html'
      - 'scripts/package_auction_product.py'
      - '.github/workflows/auction-readiness.yml'
  pull_request:
    paths:
      - 'sale-service/**'
      - 'checkout.html'
      - 'scripts/package_auction_product.py'
      - '.github/workflows/auction-readiness.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install service dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt -r sale-service/requirements.txt
      - name: Run auction and readiness tests
        env:
          PYTHONPATH: .:sale-service
        run: |
          python -m unittest discover -s tests -v
          python -m unittest discover -s sale-service/tests -v
      - name: Produce current fail-closed readiness report
        run: |
          python sale-service/readiness.py \
            --product sale-service/products/MOSUL-GENESIS-000001.json \
            --assets sale-service/products/MOSUL-GENESIS-000001.assets.json \
            --output auction-readiness.json
      - name: Upload readiness evidence
        uses: actions/upload-artifact@v4
        with:
          name: auction-readiness
          path: auction-readiness.json
          retention-days: 30
