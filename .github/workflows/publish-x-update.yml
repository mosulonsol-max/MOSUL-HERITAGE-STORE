name: Publish approved project update to X

on:
  push:
    branches:
      - main
    paths:
      - social/updates.json

permissions:
  contents: read

concurrency:
  group: publish-x-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the update queue
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the pinned OAuth client
        run: python -m pip install --disable-pip-version-check requests-oauthlib==2.0.0
      - name: Publish the new approved update
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_EVENT_AFTER: ${{ github.event.after }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: python scripts/post_x_update.py
