name: Publish approved project update to X

on:
  # Bot-created PR merges do not emit a push event that starts another workflow.
  # Run on the merge event itself so scheduled updates are actually published.
  pull_request:
    types:
      - closed

permissions:
  contents: read

concurrency:
  group: publish-x-update-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.run_attempt == 1 && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the merged update queue
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the pinned OAuth client
        run: python -m pip install --disable-pip-version-check requests-oauthlib==2.0.0
      - name: Publish the new approved update
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.pull_request.base.sha }}
          GITHUB_EVENT_AFTER: ${{ github.event.pull_request.merge_commit_sha }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: python scripts/post_x_update.py
