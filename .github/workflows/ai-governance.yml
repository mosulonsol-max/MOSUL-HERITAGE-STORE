name: AI governance checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt -r sale-service/requirements.txt
      - name: Test policy, evidence ledger, registry, and orchestrator
        env:
          PYTHONPATH: ai-engine
        run: python -m unittest discover -s ai-engine/tests -v
      - name: Test scheduled social queue
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -v
      - name: Test Devnet payment, settlement, refund, and sales ledger
        env:
          PYTHONPATH: payment-service
        run: python -m unittest discover -s payment-service/tests -v
      - name: Test fail-closed Mainnet USDC sale path
        env:
          PYTHONPATH: sale-service
        run: python -m unittest discover -s sale-service/tests -v
      - name: Validate dry-run plan
        run: python ai-engine/run_agent.py --no-execute --audit /tmp/mosul-ai-audit.jsonl
