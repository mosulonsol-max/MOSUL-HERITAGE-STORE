name: Publish project updates to Telegram

on:
  # Keep the scheduled, explicitly approved queue path.
  push:
    branches: [main]
    paths:
      - social/updates.json
  # Publish development status for merged project changes too.
  pull_request:
    types: [closed]

permissions:
  contents: read

concurrency:
  group: publish-telegram-update-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.run_attempt == 1 && (github.event_name != 'pull_request' || github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Telegram configuration
        id: telegram-config
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Telegram is not configured; no message sent."
          fi

      - name: Check out merged project state
        if: steps.telegram-config.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        if: steps.telegram-config.outputs.enabled == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publish approved update or merged project status
        if: steps.telegram-config.outputs.enabled == 'true'
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_BEFORE: ${{ github.event.pull_request.base.sha || github.event.before }}
          GITHUB_EVENT_AFTER: ${{ github.event.pull_request.merge_commit_sha || github.event.after }}
          GITHUB_PR_TITLE: ${{ github.event.pull_request.title }}
          GITHUB_PR_URL: ${{ github.event.pull_request.html_url }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/post_telegram_update.py
