name: Devnet payment and NFT rehearsal

on:
  push:
    branches:
      - codex/auction-simulation-review
    paths:
      - "payment-service/**"
      - "sale-service/**"
      - "devnet-tests/**"
      - ".github/workflows/devnet-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mosul-devnet-e2e
  cancel-in-progress: false

jobs:
  devnet-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: devnet-tests/package-lock.json
      - name: Install isolated Devnet test dependencies
        run: |
          python -m pip install -r payment-service/requirements-devnet-test.txt
          python -m pip install -r sale-service/requirements.txt
          npm ci --prefix devnet-tests
      - id: unit_tests
        name: Run payment and auction unit tests
        run: |
          PYTHONPATH=payment-service python -m unittest discover -s payment-service/tests -v
          PYTHONPATH=sale-service python -m unittest discover -s sale-service/tests -v
      - id: native_sol
        name: Rehearse native SOL payment on Devnet
        if: ${{ success() }}
        continue-on-error: true
        env:
          PYTHONPATH: payment-service
        run: python payment-service/live_devnet_test.py
      - id: token_2022
        name: Rehearse Token-2022 MOSUL test-mint payment and refund on Devnet
        if: ${{ always() && steps.unit_tests.outcome == 'success' }}
        continue-on-error: true
        env:
          PYTHONPATH: payment-service
        run: python devnet-tests/run_mosul_token_e2e.py
      - id: core_nft
        name: Rehearse Metaplex Core mint and transfer on Devnet
        if: ${{ always() && steps.unit_tests.outcome == 'success' }}
        continue-on-error: true
        run: npm --prefix devnet-tests run test:core-nft
      - name: Report live rehearsal outcomes
        if: ${{ always() }}
        env:
          NATIVE_SOL: ${{ steps.native_sol.outcome }}
          TOKEN_2022: ${{ steps.token_2022.outcome }}
          CORE_NFT: ${{ steps.core_nft.outcome }}
        run: |
          printf 'native SOL rehearsal: %s\\n' "$NATIVE_SOL"
          printf 'Token-2022 payment/refund rehearsal: %s\\n' "$TOKEN_2022"
          printf 'Metaplex Core rehearsal: %s\\n' "$CORE_NFT"
          test "$NATIVE_SOL" = success && test "$TOKEN_2022" = success && test "$CORE_NFT" = success
