name: Hourly artwork preview pipeline
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hourly-artwork.yml'
      - 'ai-engine/**'
      - 'config/ai-capabilities.json'
      - 'requirements*.txt'
      - 'scripts/build_catalog.py'
      - 'scripts/generate_*.py'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: mosul-artwork-pipeline
  cancel-in-progress: false
jobs:
  artwork:
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 55
    runs-on: ${{ vars.ARTWORK_BACKEND == 'flux-local' && fromJSON('["self-hosted","linux","x64","gpu"]') || 'ubuntu-latest' }}
    outputs:
      ready: ${{ steps.generate.outputs.ready }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          path: source
      - name: Prepare persistent artwork branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: data
      - name: Switch to artwork data branch
        run: |
          if git -C data ls-remote --exit-code origin refs/heads/artwork-data >/dev/null 2>&1; then
            git -C data fetch origin artwork-data
            git -C data switch -C artwork-data FETCH_HEAD
          else
            git -C data switch -c artwork-data
          fi
          if [ ! -f data/catalog.json ]; then echo '{"items":[]}' > data/catalog.json; fi
      - name: Install engine and selected generator dependencies
        env:
          ARTWORK_BACKEND: ${{ vars.ARTWORK_BACKEND || 'cpu-free' }}
        run: |
          python -m pip install --disable-pip-version-check -r source/requirements.txt
          if [ "$ARTWORK_BACKEND" = "flux-local" ]; then
            python -m pip install --disable-pip-version-check -r source/requirements-gpu.txt
          elif [ "$ARTWORK_BACKEND" = "cpu-free" ]; then
            python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu
            python -m pip install --disable-pip-version-check -r source/requirements-cpu.txt
          fi
      - name: Cache pinned model weights
        if: ${{ (vars.ARTWORK_BACKEND || 'cpu-free') == 'cpu-free' }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: mosul-small-sd-728f8b598d7d305bd30c20cbdfbaa6ffa7eec9cc
      - name: Test AI policy before execution
        env:
          PYTHONPATH: source/ai-engine
        run: |
          python -m unittest discover -s source/ai-engine/tests -v
          python -m unittest discover -s source/tests -v
      - name: Plan and generate one governed preview
        id: generate
        env:
          AI_PLANNER_ENABLED: ${{ vars.AI_PLANNER_ENABLED }}
          OLLAMA_BASE_URL: ${{ vars.OLLAMA_BASE_URL }}
          OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL }}
          ARTWORK_BACKEND: ${{ vars.ARTWORK_BACKEND || 'cpu-free' }}
          ARTWORK_API_URL: ${{ secrets.ARTWORK_API_URL }}
          ARTWORK_API_KEY: ${{ secrets.ARTWORK_API_KEY }}
          ARTWORK_MODEL: ${{ vars.ARTWORK_MODEL }}
          ARTWORK_REFERENCE_QUERY: ${{ vars.ARTWORK_REFERENCE_QUERY }}
          ARTWORK_SIGNING_KEY_B64: ${{ secrets.ARTWORK_SIGNING_KEY_B64 }}
          MARKET_COMPS_API_URL: ${{ secrets.MARKET_COMPS_API_URL }}
          MARKET_COMPS_API_KEY: ${{ secrets.MARKET_COMPS_API_KEY }}
        run: python source/ai-engine/run_agent.py --output-dir data --audit data/ai-audit.jsonl --generator source/scripts/generate_artwork.py --registry source/config/ai-capabilities.json
      - name: Save generated preview record
        if: steps.generate.outputs.ready == 'true'
        run: |
          git -C data config user.name 'github-actions[bot]'
          git -C data config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C data add catalog.json generated/ ai-audit.jsonl
          git -C data commit -m 'Generate hourly governed heritage artwork preview'
          git -C data push origin HEAD:artwork-data
      - name: Assemble public preview
        if: steps.generate.outputs.ready == 'true'
        run: |
          cp data/catalog.json source/catalog.json
          mkdir -p source/generated
          cp -a data/generated/. source/generated/
          python source/scripts/build_catalog.py source
      - name: Upload Pages artifact
        if: steps.generate.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: source
  deploy:
    if: needs.artwork.outputs.ready == 'true'
    needs: artwork
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Publish GitHub Pages preview
        id: deployment
        uses: actions/deploy-pages@v4
