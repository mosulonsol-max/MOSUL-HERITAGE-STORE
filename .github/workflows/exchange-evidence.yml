name: MOSUL live exchange evidence
on:
  pull_request:
    paths:
      - '.github/workflows/exchange-evidence.yml'
      - 'scripts/verify_exchange_evidence.py'
  schedule:
    - cron: '29 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/exchange-evidence.yml'
      - 'scripts/verify_exchange_evidence.py'
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect live public exchange evidence
        run: python scripts/verify_exchange_evidence.py
      - name: Store timestamped raw evidence
        uses: actions/upload-artifact@v4
        with:
          name: mosul-exchange-evidence
          path: exchange-evidence.json
          retention-days: 14
      - name: Publish timestamped evidence to data branch
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp exchange-evidence.json "$RUNNER_TEMP/exchange-evidence.json"
          # The collector creates this untracked file in the main checkout.
          # Remove it after preserving the artifact so switching to the data branch is safe.
          rm -- exchange-evidence.json
          git fetch origin exchange-evidence-data
          git switch -C exchange-evidence-data origin/exchange-evidence-data
          cp "$RUNNER_TEMP/exchange-evidence.json" exchange-evidence.json
          git add exchange-evidence.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update public Solana and DEX listing evidence'
            git push origin HEAD:exchange-evidence-data
          fi
